name: iOS Build & Submit
on:
  workflow_dispatch:
    inputs:
      submit:
        description: Upload the finished build to App Store Connect (does not request App Review)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: ios-release
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Only main may submit
        if: ${{ inputs.submit && github.ref != 'refs/heads/main' }}
        run: echo '::error::Submission requires main' && exit 1
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22.13.1
          cache: npm
          cache-dependency-path: mobile/package-lock.json
      - run: npm ci
        working-directory: mobile
      - uses: expo/expo-github-action@c7b66a9c327a43a8fa7c0158e7f30d6040d2481e # v8
        with:
          eas-version: 24.10.0
          token: ${{ secrets.EXPO_TOKEN }}
      - name: Validate native TypeScript
        run: npm run typecheck
        working-directory: mobile
      - name: Build exact iOS archive
        working-directory: mobile
        run: eas build --platform ios --profile production --non-interactive --json > build-result.json
      - name: Upload this archive to App Store Connect
        if: ${{ inputs.submit }}
        working-directory: mobile
        run: |
          BUILD_ID=$(node -e 'const r=require("./build-result.json");const b=r.find(x=>x.platform==="IOS"&&x.status==="FINISHED");if(!b)process.exit(1);console.log(b.id)')
          eas submit --platform ios --profile production --non-interactive --id "$BUILD_ID"
