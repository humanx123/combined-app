name: Deploy Firebase rules

on:
  push:
    branches: [main]
    paths:
      - firestore.rules
      - firestore.indexes.json
      - storage.rules
      - firebase.json
      - .github/workflows/firebase-rules.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firebase-rules-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: read
      id-token: write
    env:
      FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - name: Check deployment configuration
        env:
          PROVIDER: ${{ vars.FIREBASE_WORKLOAD_IDENTITY_PROVIDER }}
          SERVICE_ACCOUNT: ${{ vars.FIREBASE_SERVICE_ACCOUNT }}
        run: |
          test -n "$FIREBASE_PROJECT_ID" || { echo 'Set the production environment variable FIREBASE_PROJECT_ID'; exit 1; }
          test -n "$PROVIDER" || { echo 'Set FIREBASE_WORKLOAD_IDENTITY_PROVIDER'; exit 1; }
          test -n "$SERVICE_ACCOUNT" || { echo 'Set FIREBASE_SERVICE_ACCOUNT'; exit 1; }
      - name: Authenticate to Google Cloud with GitHub OIDC
        uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3
        with:
          workload_identity_provider: ${{ vars.FIREBASE_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.FIREBASE_SERVICE_ACCOUNT }}
      - name: Deploy Firestore rules, indexes, and Storage rules
        run: npx --yes firebase-tools@15.34.0 deploy --only firestore:rules,firestore:indexes,storage --project "$FIREBASE_PROJECT_ID" --non-interactive
