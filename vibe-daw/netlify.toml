[build]
  command = "node scripts/check-legal.mjs && npm run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "22"

# Single-page app: "/" is the prerendered landing page (dist/index.html). Every other route
# serves the empty app shell, so the studio never flashes landing markup.
[[redirects]]
  from = "/*"
  to = "/app.html"
  status = 200

# The service worker must always be fresh, or a deploy could hide behind an old one.
[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "microphone=(self)"

[functions]
  directory = "netlify/functions"
  node_bundler = "esbuild"

[[headers]]
  for = "/.well-known/apple-app-site-association"
  [headers.values]
    Content-Type = "application/json"
    Cache-Control = "public, max-age=3600"
